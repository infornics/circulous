# Circulous Distribution Build Configuration

# Distribution Identity (STRICTLY NO "OS" KEYWORD)
DISTRO_NAME="Circulous"
DISTRO_ID="circulous"
DISTRO_VERSION="1.0-alpha"
DISTRO_CODENAME="circulous"
DISTRO_DESCRIPTION="Circulous Linux Distribution"

# Base System Settings
UBUNTU_RELEASE="resolute"       # Ubuntu 26.04 base
ARCH="amd64"                    # x86_64 architecture
MIRROR_URL="http://archive.ubuntu.com/ubuntu"

# Target ISO Output Settings
ISO_NAME="Circulous-1.0-alpha-amd64.iso"
VOLUME_LABEL="Circulous_Live"

# Directories
PROJECT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
BUILD_DIR="${PROJECT_DIR}/build"
WORK_DIR="${BUILD_DIR}/work"
ROOTFS_DIR="${BUILD_DIR}/rootfs"
ISO_DIR="${BUILD_DIR}/iso_root"
OUTPUT_DIR="${PROJECT_DIR}/out"

# Live Environment Default Settings
LIVE_USER="circulous"
LIVE_HOSTNAME="circulous"
